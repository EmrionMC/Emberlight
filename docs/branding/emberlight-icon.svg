<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Emberlight icon</title>
  <defs>
    <clipPath id="glass">
      <circle cx="256" cy="256" r="150"/>
    </clipPath>
    <path id="flame" d="M246 128
      C278 134 300 161 300 191
      C300 217 282 238 277 255
      C275 261 277 264 283 262
      C299 257 313 242 317 225
      C318 221 322 220 325 224
      C350 255 354 298 339 331
      C325 363 294 379 256 379
      C204 379 163 341 163 292
      C163 257 183 229 210 210
      C230 196 247 185 251 166
      C254 154 250 144 242 134
      C239 130 241 127 246 128Z"/>
    <clipPath id="flame-edge">
      <use href="#flame" xlink:href="#flame"/>
    </clipPath>
    <g id="rivet">
      <circle r="12" fill="#8d4318"/>
      <circle cy="-1" r="8" fill="#ffe095"/>
    </g>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffb47e" stop-opacity="0"/>
      <stop offset=".48" stop-color="#ffb47e" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffb47e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Terracotta housing -->
  <rect width="512" height="512" rx="53" fill="#b8402a"/>
  <rect x="24" y="24" width="464" height="464" rx="29" fill="#9e3221"/>
  <rect x="34" y="34" width="444" height="444" rx="19" fill="#b03a26"/>

  <!-- Circular bezel, with two flat tones on each bevel -->
  <circle cx="256" cy="263" r="204" fill="#81281c"/>
  <circle cx="256" cy="256" r="204" fill="#ca701b"/>
  <path d="M111.75 400.25 A204 204 0 0 1 400.25 111.75
           Z" fill="#ffdc77"/>
  <circle cx="256" cy="256" r="192" fill="#f2b33d"/>
  <path d="M120.24 391.76 A192 192 0 0 0 391.76 120.24Z" fill="#e99b2b"/>
  <circle cx="256" cy="256" r="165" fill="#ffe095"/>
  <path d="M139.33 372.67 A165 165 0 0 1 372.67 139.33Z" fill="#b5611a"/>
  <circle cx="256" cy="256" r="155" fill="#58170f"/>

  <!-- Glass, diagonal reflection and specular highlight -->
  <circle cx="256" cy="256" r="150" fill="#7a1d14"/>
  <g clip-path="url(#glass)">
    <rect x="55" y="223" width="402" height="66" transform="rotate(-43 256 256)" fill="url(#reflection)"/>
    <path d="M137 186L176 148" fill="none" stroke="#fbf0d6" stroke-width="13" stroke-linecap="round" opacity=".86"/>
  </g>

  <!-- Flame and warm shadow side -->
  <use href="#flame" xlink:href="#flame" fill="#fbf0d6"/>
  <path clip-path="url(#flame-edge)" fill="#f5cf95" d="M325 224
    C347 264 313 296 278 316
    C249 332 239 354 245 382
    L358 389 365 233Z"/>

  <use href="#rivet" xlink:href="#rivet" x="75" y="256"/>
  <use href="#rivet" xlink:href="#rivet" x="437" y="256"/>
</svg>
