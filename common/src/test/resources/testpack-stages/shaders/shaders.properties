# Emrion test pack for tessellation and geometry stages.
# gbuffers_terrain + shadow: a geometry shader shrinks every triangle towards its centre (gaps show the sky) and tints it
# by its view-space face normal. gbuffers_entities: tessellation (level 4) puffs every triangle out along its normal.
# final shows shadowcolor0 (the shadow-pass terrain, through shadow.gsh) in the bottom-left corner.
iris.features.optional = TESSELLATION_SHADERS
# shadowcomp inverts shadowcolor0 (written to its alt image, read there afterwards: shadowcolor flipping).
# composite1 tints the top-right sixteenth red through a viewport offset (scale.<program> = scale offsetX offsetY).
scale.composite1 = 0.25 0.7 0.7
