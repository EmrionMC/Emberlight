plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }

base { archivesName = 'emberlight' }

// Sodium is a required dependency (fabric.mod.json): compiled against, never bundled (Polyform Shield). runClient loads the
// local Sodium jar from -PirisModsDir (not the runtime classpath, which runIrisReference shares with its own Sodium).
repositories { exclusiveContent { forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }; filter { includeGroup 'maven.modrinth' } } }

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	compileOnly "maven.modrinth:sodium:${sodium_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	implementation project(':converter')
	include project(':converter')
}

// Forward every -Demberlight.* / -Demrion.* (old name) given to Gradle (`./gradlew :mod:runClient -Demberlight.autotest.world=w`)
// to the game JVM, as emrion.* (the names the code reads; the new name wins), and force the Vulkan backend (the launch arg wins
// over options.txt and MC's crash guard).
def emrionProps = providers.systemPropertiesPrefixedBy('emrion.').zip(providers.systemPropertiesPrefixedBy('emberlight.')) { a, b ->
	a + b.collectEntries { k, v -> ['emrion.' + k.substring('emberlight.'.length()), v] }
}

// Iris reference run (docs/BENCHMARK.md): local Iris + Sodium jars, loaded at runtime from their directory (never
// copied into the repo), plus the shared pack, settings and options for side-by-side comparisons with runClient -Pcompare.
// -PirisModsDir=<launcher instance>/mods; default: mod/run-iris/mods (untracked).
def irisModsDir = file(findProperty('irisModsDir') ?: 'run-iris/mods')
def packDir = file(findProperty('shaderPack') ?: rootProject.file('testpacks/unbound-euphoria-r510'))
// -PshaderSettings= (empty): no settings file, the pack's defaults. A zip pack is linked under its own file name.
def settingsProp = findProperty('shaderSettings')
def packSettings = settingsProp == '' ? null : file(settingsProp ?: rootProject.file('testpacks/ComplementaryUnbound_r5.10 + EuphoriaPatches_1.11.2.txt'))
def packName = packDir.isFile() || packSettings == null ? packDir.name : packSettings.name - ~/\.txt$/ // so Iris finds <pack>.txt
def compare = providers.gradleProperty('compare').isPresent()
// The canonical comparison world: the one the Iris reference run created (and keeps using). runClient -Pcompare copies it
// (read-only from the source) over its own run/saves/<world> before every start, so both runs render the same blocks.
def sceneWorld = file(findProperty('sceneWorld') ?: 'run-iris/saves/scenes')
configurations { irisReference { canBeConsumed = false } }
dependencies { irisReference fileTree(irisModsDir) { include 'iris-fabric-*.jar', 'sodium-fabric-*.jar' } }
def sodiumJars = fileTree(irisModsDir) { include 'sodium-fabric-*.jar' }
// -Pbbe: runClient also loads Better Block Entities (compat tests); -Pbbe=<jar>, else the bbe-fabric-*.jar in -PirisModsDir
def bbeProp = findProperty('bbe')
def bbeJars = bbeProp == null ? files() : bbeProp in ['', 'true'] ? fileTree(irisModsDir) { include 'bbe-fabric-*.jar' } : files(bbeProp)

// Same options for both runs: fixed video settings, sound off and FOV effects off (deterministic camera).
// Merged into options.txt, other keys are kept.
def sharedOptions = [renderDistance: findProperty('renderDistance') ?: '16', // -PrenderDistance=32 for CPU-bound runs
		 simulationDistance: '12', enableVsync: 'false', maxFps: '260', guiScale: '3', fov: '0.0',
		fovEffectScale: '0.0', gamma: '0.5', biomeBlendRadius: '3', mipmapLevels: '4', textureFiltering: '0', ao: 'true', entityShadows: 'true',
		entityDistanceScaling: '5.0', particles: '0', chunkSectionFadeInTime: '0.0', prioritizeChunkUpdates: '0', fullscreen: 'false',
		onboardAccessibility: 'false', tutorialStep: 'none', soundCategory_master: '0.0', pauseOnLostFocus: 'false',
		inactivityFpsLimit: '"minimized"'] // "afk" drops an unattended game to 30 FPS after a minute
def writeOptions = { File dir, String backend ->
	def f = new File(dir, 'options.txt')
	def opts = new LinkedHashMap<String, String>()
	if (f.exists()) f.eachLine { l -> def i = l.indexOf(':'); if (i > 0) opts[l.substring(0, i)] = l.substring(i + 1) }
	opts.putAll(sharedOptions)
	opts.preferredGraphicsBackend = "\"${backend}\""
	dir.mkdirs()
	f.text = opts.collect { k, v -> "${k}:${v}" }.join('\n') + '\n'
}
// Windows without Developer Mode or admin cannot create symlinks: copy the target instead.
def linkOrCopy = { java.nio.file.Path link, java.nio.file.Path target ->
	// only a copy this fallback made (marker) is deleted recursively; anything else keeps the old deleteIfExists behaviour
	if (java.nio.file.Files.exists(link.resolve('.emberlight-copy'), java.nio.file.LinkOption.NOFOLLOW_LINKS)) project.delete(link.toFile())
	else java.nio.file.Files.deleteIfExists(link)
	try {
		java.nio.file.Files.createSymbolicLink(link, target)
	} catch (IOException | UnsupportedOperationException e) {
		logger.warn("Cannot symlink ${link} (${e}), copying ${target} instead")
		if (java.nio.file.Files.isDirectory(target)) {
			project.copy { from target.toFile(); into link.toFile() }
			java.nio.file.Files.createFile(link.resolve('.emberlight-copy'))
		}
		else java.nio.file.Files.copy(target, link)
	}
}
// shaderpacks/<packName> -> the pack folder (symlink), shaderpacks/<packName>.txt = copy of the settings (Iris rewrites it).
def linkPack = { File dir ->
	if (!packDir.exists() || (packSettings != null && !packSettings.isFile())) throw new GradleException("Shader pack ${packDir} or settings ${packSettings} missing (-PshaderPack, -PshaderSettings)")
	def link = new File(dir, "shaderpacks/${packName}").toPath()
	java.nio.file.Files.createDirectories(link.parent)
	linkOrCopy(link, packDir.toPath().toAbsolutePath())
	def txt = link.resolveSibling("${packName}.txt")
	if (packSettings != null) java.nio.file.Files.copy(packSettings.toPath(), txt, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	else java.nio.file.Files.deleteIfExists(txt) // a settings file a previous run (or Iris) left behind
}
// -Demrion.autotest.resourcepacks=/abs/a.zip;/abs/b.zip: symlink them into <runDir>/resourcepacks (never committed) and
// enable exactly them in options.txt; an empty value enables none. (Listing a compatible pack as incompatible would
// make MC skip it.) Both runClient and runIrisReference, so the reference sees the same resource packs.
def linkResourcePacks = { File runDir ->
	def packs = emrionProps.get()['emrion.autotest.resourcepacks']
	if (packs == null) return
	def optionsFile = new File(runDir, 'options.txt')
	def dir = new File(runDir, 'resourcepacks')
	dir.mkdirs()
	def names = packs.split(';').findAll { it }.collect { p ->
		def src = new File(p)
		if (!src.exists()) throw new GradleException("resource pack not found: $p")
		def link = new File(dir, src.name).toPath()
		linkOrCopy(link, src.toPath())
		'file/' + src.name
	}
	// MC refuses symlinked packs unless their targets are listed here (prefix match)
	new File(runDir, 'allowed_symlinks.txt').text = packs.split(';').findAll { it }.collect { new File(it).parent + '/' }.unique().join('\n') + '\n'
	def list = groovy.json.JsonOutput.toJson(['vanilla'] + names)
	def lines = optionsFile.readLines().findAll { !it.startsWith('resourcePacks:') && !it.startsWith('incompatibleResourcePacks:') }
	optionsFile.text = (lines + ["resourcePacks:$list", "incompatibleResourcePacks:[]"]).join('\n') + '\n'
}
// -Demrion.autotest.scenes is resolved against mod/ (the game runs in its run dir).
def forwardEmrionProps = { JavaExec task, Map<String, String> defaults ->
	(defaults + emrionProps.get()).each { k, v -> task.jvmArgs "-D${k}=${k == 'emrion.autotest.scenes' ? file(v).absolutePath : v}" }
}

loom {
	runs {
		client {
			// -PgraphicsBackend=opengl: check that the mod stays inert on OpenGL
			programArgs '--graphicsBackend', findProperty('graphicsBackend') ?: 'vulkan'
		}
		irisReference {
			client()
			name 'Iris Reference (OpenGL)'
			runDir 'run-iris'
			programArgs '--graphicsBackend', 'opengl', '--width', findProperty('winWidth') ?: '1920', '--height', findProperty('winHeight') ?: '1080' // same -PwinWidth/-PwinHeight as runClient
		}
	}
}
tasks.named('runClient') {
	def optionsFile = file('run/options.txt')
	doFirst {
		// before anything below touches the run dir
		if (sodiumJars.files.size() != 1) throw new GradleException("Expected one Sodium jar in ${irisModsDir} (-PirisModsDir), found ${sodiumJars.files*.name}")
		if (bbeProp != null && (bbeJars.files.size() != 1 || !bbeJars.singleFile.isFile())) throw new GradleException("Expected one BBE jar for -Pbbe, found ${bbeJars.files*.name}")
		if (compare) {
			def world = emrionProps.get()['emrion.autotest.world']
			if (world != null) {
				if (!new File(sceneWorld, 'level.dat').isFile()) throw new GradleException("Comparison world ${sceneWorld} missing: run runIrisReference first or pass -PsceneWorld=<dir>")
				def dst = file("run/saves/${world}")
				// rsync only replaces what the last run changed (size/mtime); plain copy without it
				def rsync = ['rsync', '-a', '--delete', '--exclude', 'session.lock', "${sceneWorld}/", "${dst}/"]
				dst.parentFile.mkdirs()
				def ok = false
				try { ok = rsync.execute().waitFor() == 0 } catch (IOException ignored) {}
				if (!ok) {
					project.delete(dst)
					project.copy { from sceneWorld; into dst; exclude 'session.lock' }
				}
			}
			linkPack(file('run'))
			writeOptions(file('run'), 'vulkan')
			args '--width', findProperty('winWidth') ?: '1920', '--height', findProperty('winHeight') ?: '1080' // -PwinWidth/-PwinHeight: resolution-scaling tests
		}
		// -Pserver=127.0.0.1:25570: the autotest joins a local test server (docs/BENCHMARK.md) as an op'd offline player
		// (-PtestUsername, default EmbTest), as does a snapshot replay (it may pick that server itself)
		def server = findProperty('server')
		if (server) jvmArgs "-Demrion.autotest.server=${server}"
		if (server || (emrionProps.get()['emrion.autotest.script'] ?: '').contains('snapshot ')) args '--username', findProperty('testUsername') ?: 'EmbTest'
		if (findProperty('renderDebugLabels')) args '--renderDebugLabels' // names MC's Vulkan objects (validation-layer leak reports)
		// one shared VkPipelineCache for all run dirs (-PpipelineCacheDir= : the run dir's own)
		def cacheDir = findProperty('pipelineCacheDir') ?: "${System.getProperty('user.home')}/.cache/emberlight-dev"
		def defaults = cacheDir ? ['emrion.pipelineCacheDir': cacheDir.toString()] : [:]
		forwardEmrionProps(it, defaults + (compare ? ['emrion.pack': packName, 'emrion.autotest.tag': 'emrion'] : [:]))
		// Also persist the in-game setting so the options screen shows Vulkan in dev.
		if (!optionsFile.exists()) {
			optionsFile.parentFile.mkdirs()
			optionsFile.text = 'preferredGraphicsBackend:"vulkan"\nonboardAccessibility:false\n'
		}
		linkResourcePacks(optionsFile.parentFile)
		jvmArgs "-Dfabric.addMods=${(sodiumJars.files + bbeJars.files).join(File.pathSeparator)}"
		def sodium = new File(irisModsDir.parentFile, 'config/sodium-options.json')
		new File(optionsFile.parentFile, 'config').mkdirs()
		if (sodium.isFile()) java.nio.file.Files.copy(sodium.toPath(), new File(optionsFile.parentFile, 'config/sodium-options.json').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	}
}
tasks.named('runIrisReference') {
	def mods = configurations.irisReference
	def runDir = file('run-iris')
	def userConfig = new File(irisModsDir.parentFile, 'config')
	doFirst {
		if (mods.files.size() != 2) throw new GradleException("Expected the Iris and Sodium jars in ${irisModsDir} (-PirisModsDir), found ${mods.files*.name}")
		jvmArgs "-Dfabric.addMods=${mods.files.join(File.pathSeparator)}"
		linkPack(runDir)
		writeOptions(runDir, 'opengl')
		linkResourcePacks(runDir)
		new File(runDir, 'config').mkdirs()
		// our Sodium version pin would refuse the user's Iris + Sodium pair
		new File(runDir, 'config/fabric_loader_dependencies.json').text = '{"version": 1, "overrides": {"emberlight": {"-depends": {"sodium": "IGNORED"}, "-breaks": {"sodium": "IGNORED"}}}}\n'
		new File(runDir, 'config/iris.properties').text = """shaderPack=${packName}
enableShaders=true
maxShadowRenderDistance=24
colorSpace=SRGB
allowUnknownShaders=false
disableUpdateMessage=true
"""
		def sodium = new File(userConfig, 'sodium-options.json')
		if (sodium.isFile()) java.nio.file.Files.copy(sodium.toPath(), new File(runDir, 'config/sodium-options.json').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		forwardEmrionProps(it, ['emrion.autotest.tag': 'iris'])
	}
}

// Fails with a readable message instead of Gradle's "A problem occurred starting process 'command 'glslc''".
class Glslc {
	static void require() {
		try { new ProcessBuilder('glslc', '--version').redirectErrorStream(true).start().with { it.inputStream.text; it.waitFor() } }
		catch (IOException e) { throw new GradleException('glslc not found on PATH: install the Vulkan SDK (or shaderc)', e) }
	}
}

// Test/debug shaders: mod/src/main/glsl/*.{vert,frag,comp} -> assets/emberlight/spv/<name>.spv (glslc on PATH).
abstract class CompileGlsl extends DefaultTask {
	@InputDirectory abstract DirectoryProperty getSource()
	@OutputDirectory abstract DirectoryProperty getOutput()
	@javax.inject.Inject abstract ExecOperations getExecOps()

	@TaskAction
	void compile() {
		Glslc.require()
		def out = output.get().dir('assets/emberlight/spv').asFile
		out.deleteDir()
		out.mkdirs()
		source.get().asFile.eachFileMatch(~/.*\.(vert|frag|comp)$/) { f ->
			execOps.exec { commandLine 'glslc', '--target-env=vulkan1.2', '-O', f.absolutePath, '-o', new File(out, f.name + '.spv').absolutePath }
		}
	}
}
def compileGlsl = tasks.register('compileGlsl', CompileGlsl) {
	source = layout.projectDirectory.dir('src/main/glsl')
	output = layout.buildDirectory.dir('generated/spv')
}
sourceSets.main.resources.srcDir(compileGlsl)

// AMD FSR 3.1 upscaler (MIT, vendored in src/main/glsl/fidelityfx): one fixed permutation per pass
// (LDR colour, render-size unjittered motion vectors, forward depth, Lanczos LUT, no FP16), plus accumulate with sharpening.
// No -O: spirv-opt strips the resource names the host binds by (the driver optimises anyway).
abstract class CompileFsr3 extends DefaultTask {
	@InputDirectory abstract DirectoryProperty getSource()
	@OutputDirectory abstract DirectoryProperty getOutput()
	@javax.inject.Inject abstract ExecOperations getExecOps()

	@TaskAction
	void compile() {
		def src = source.get().asFile
		Glslc.require()
		def out = output.get().dir('assets/emberlight/spv/fsr3').asFile
		out.deleteDir()
		out.mkdirs()
		def defines = ['FFX_GPU=1', 'FFX_GLSL=1', 'FFX_HALF=0', 'FFX_FSR3UPSCALER_OPTION_UPSAMPLE_SAMPLERS_USE_DATA_HALF=0',
				'FFX_FSR3UPSCALER_OPTION_ACCUMULATE_SAMPLERS_USE_DATA_HALF=0', 'FFX_FSR3UPSCALER_OPTION_REPROJECT_SAMPLERS_USE_DATA_HALF=1',
				'FFX_FSR3UPSCALER_OPTION_POSTPROCESSLOCKSTATUS_SAMPLERS_USE_DATA_HALF=0', 'FFX_FSR3UPSCALER_OPTION_UPSAMPLE_USE_LANCZOS_TYPE=2',
				'FFX_FSR3UPSCALER_OPTION_REPROJECT_USE_LANCZOS_TYPE=1', 'FFX_FSR3UPSCALER_OPTION_HDR_COLOR_INPUT=0',
				'FFX_FSR3UPSCALER_OPTION_LOW_RESOLUTION_MOTION_VECTORS=1', 'FFX_FSR3UPSCALER_OPTION_JITTERED_MOTION_VECTORS=0',
				'FFX_FSR3UPSCALER_OPTION_INVERTED_DEPTH=0']
		def passes = ['prepare_inputs', 'luma_pyramid', 'shading_change_pyramid', 'shading_change', 'prepare_reactivity', 'luma_instability', 'accumulate', 'rcas']
		def variants = passes.collect { [it, it, 0] } + [['accumulate_sharpen', 'accumulate', 1]]
		variants.each { v ->
			def args = ['glslc', '--target-env=vulkan1.2', '-fshader-stage=comp', "-I${src}/gpu", "-I${src}/gpu/fsr3upscaler"]
			args += defines.collect { "-D${it}" } + ["-DFFX_FSR3UPSCALER_OPTION_APPLY_SHARPENING=${v[2]}"]
			args += [new File(src, "passes/ffx_fsr3upscaler_${v[1]}_pass.glsl").absolutePath, '-o', new File(out, "${v[0]}.spv").absolutePath]
			execOps.exec { commandLine args }
		}
	}
}
def compileFsr3 = tasks.register('compileFsr3', CompileFsr3) {
	source = layout.projectDirectory.dir('src/main/glsl/fidelityfx')
	output = layout.buildDirectory.dir('generated/fsr3')
}
sourceSets.main.resources.srcDir(compileFsr3)

// AMD FSR 3 frame interpolation + optical flow (MIT, same vendored SDK): every pass in one permutation
// (render-size unjittered motion vectors, forward depth, SDR, no FP16) -> assets/emberlight/spv/fsr3fg/<pass>.spv.
abstract class CompileFsr3Fg extends DefaultTask {
	@InputDirectory abstract DirectoryProperty getSource()
	@OutputDirectory abstract DirectoryProperty getOutput()
	@javax.inject.Inject abstract ExecOperations getExecOps()

	@TaskAction
	void compile() {
		def src = source.get().asFile
		Glslc.require()
		def out = output.get().dir('assets/emberlight/spv/fsr3fg').asFile
		out.deleteDir()
		out.mkdirs()
		def defines = ['FFX_GPU=1', 'FFX_GLSL=1', 'FFX_HALF=0', 'FFX_FRAMEINTERPOLATION_OPTION_LOW_RES_MOTION_VECTORS=1',
				'FFX_FRAMEINTERPOLATION_OPTION_JITTER_MOTION_VECTORS=0', 'FFX_FRAMEINTERPOLATION_OPTION_INVERTED_DEPTH=0',
				'FFX_OPTICALFLOW_OPTION_HDR_COLOR_INPUT=0']
		new File(src, 'passes').eachFileMatch(~/ffx_(frameinterpolation|opticalflow)(_.*)?_pass(_v5)?\.glsl$/) { f ->
			def effect = f.name.startsWith('ffx_frameinterpolation') ? 'frameinterpolation' : 'opticalflow'
			def args = ['glslc', '--target-env=vulkan1.2', '-fshader-stage=comp', "-I${src}/gpu", "-I${src}/gpu/${effect}"]
			args += defines.collect { "-D${it}" } + [f.absolutePath, '-o', new File(out, f.name.replace('.glsl', '.spv')).absolutePath]
			execOps.exec { commandLine args }
		}
	}
}
def compileFsr3Fg = tasks.register('compileFsr3Fg', CompileFsr3Fg) {
	source = layout.projectDirectory.dir('src/main/glsl/fidelityfx')
	output = layout.buildDirectory.dir('generated/fsr3fg')
}
sourceSets.main.resources.srcDir(compileFsr3Fg)

processResources {
	from rootProject.file('LICENSE-DLSS.txt') // terms of the bundled DLSS shim in natives/
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') { expand 'version': version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }

dependencies {
	testImplementation platform('org.junit:junit-bom:5.11.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }

// Iris API copy (LGPL-3.0-only, src/irisapi): packed as a nested jar resource that IrisApiShim puts on the class path
// at pre-launch only when Iris is not installed. Not on main's runtime class path, so the dev run behaves as release.
sourceSets { irisapi { compileClasspath += sourceSets.main.compileClasspath } }
def irisApiJar = tasks.register('irisApiJar', Jar) {
	archiveFileName = 'emberlight-irisapi.jar'
	destinationDirectory = layout.buildDirectory.dir('generated/irisapi')
	from sourceSets.irisapi.output
	from rootProject.files('LICENSE', 'COPYING')
}
sourceSets.main.resources.srcDir(irisApiJar.map { it.destinationDirectory })
processResources.dependsOn irisApiJar
sourceSets.main.compileClasspath += sourceSets.irisapi.output // after the line above: irisapi keeps main's original class path
dependencies { testImplementation sourceSets.irisapi.output }

// Side-by-side + MAE/SSIM per scene: run-iris/screenshots/iris-*.png vs run/screenshots/emrion-*.png -> run-compare/.
tasks.register('compareScenes', Exec) {
	group = 'verification'
	description = 'Compares the Iris reference screenshots with ours (docs/BENCHMARK.md).'
	commandLine 'python3', '-I', file('tools/compare_scenes.py').absolutePath, file(findProperty('irisShots') ?: 'run-iris/screenshots').absolutePath,
			file(findProperty('emrionShots') ?: 'run/screenshots').absolutePath, file('run-compare').absolutePath
}
